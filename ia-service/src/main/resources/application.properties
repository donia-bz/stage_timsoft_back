server.port=8085
spring.application.name=ia-service

# MongoDB Atlas - via variable d'environnement
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Logs
logging.level.org.springframework.data.mongodb.core=INFO

# Python AI Service integration URL
ia.python.url=${IA_PYTHON_URL:http://localhost:5000}

# Utiliser le service Machine Learning (Random Forest) au lieu de K-Means
ia.use.ml=true