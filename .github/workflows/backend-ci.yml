name: Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - auth-service
          - commandes-service
          - livreurs-service
          - depots-service
          - tracking-service
          - vehicles-service
          - reclamations-service
          - audit-service
          - notifications-service
          - stats-service
          - ia-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn clean verify -DskipTests=false -pl ${{ matrix.service }} -am

      - name: Build Docker image
        run: docker build --build-arg SERVICE_NAME=${{ matrix.service }} -t bfexpress-${{ matrix.service }}:latest -f Dockerfile .
